PKG_RATINGSTAR="RatingStar"
PKG_RATINGSTAR_XML_DESCRIPTION="RatingStar ist das Bewertungstool für Unternehmen: Kundenbewertungen sammeln, Bewertungen aus Google und anderen Portalen bündeln und alles mit Siegeln auf der eigenen Website zeigen. Dieses Paket bringt das Siegel-Modul und das Plugin für die Sterne in Google in Ihre Joomla-Website."
