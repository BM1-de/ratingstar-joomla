; RatingStar-Modul — Deutsch (de-DE)
; Jeder String in einer Zeile, Wert in doppelten Anführungszeichen.

MOD_RATINGSTAR="RatingStar"

MOD_RATINGSTAR_NO_SLUG="RatingStar: Es ist kein Profil-Slug konfiguriert. Öffnen Sie die Modul-Einstellungen und tragen Sie den Slug Ihres RatingStar-Profils ein."

MOD_RATINGSTAR_FIELD_SLUG_LABEL="Profil-Slug"
MOD_RATINGSTAR_FIELD_SLUG_DESC="Der Slug Ihres RatingStar-Filialprofils — der Teil nach /t/ in der öffentlichen URL (z. B. cafe-sonne bei ratingstar.de/t/cafe-sonne)."

MOD_RATINGSTAR_FIELD_VARIANT_LABEL="Widget-Variante"
MOD_RATINGSTAR_FIELD_VARIANT_DESC="Welches Siegel / Widget angezeigt wird. Statische Siegel funktionieren in jedem Tarif; Live-Widgets benötigen mindestens den 4-Star-Tarif und fallen sonst automatisch auf eine statische Banderole zurück."

MOD_RATINGSTAR_FIELD_VARIANT_NOTE_LABEL="Hinweis zu den Varianten"
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_DESC="Statische Siegel (Rundsiegel, Banderole) stehen in jedem Tarif zur Verfügung. Live-Widgets (ab Profil-Karte) brauchen den 4-Star-Tarif; in niedrigeren Tarifen reduziert RatingStar sie automatisch auf eine statische Banderole."

MOD_RATINGSTAR_VARIANT_SEAL_CIRCLE="Rundsiegel (statisch)"
MOD_RATINGSTAR_VARIANT_SEAL_CIRCLE_BANNER="Banderole (statisch)"
MOD_RATINGSTAR_VARIANT_PROFILE_CARD="Profil-Karte (live)"
MOD_RATINGSTAR_VARIANT_BAR="Trust-Bar (live)"
MOD_RATINGSTAR_VARIANT_FLOATING="Floating-Badge (live)"
MOD_RATINGSTAR_VARIANT_HERO="Hero-Snippet (live)"
MOD_RATINGSTAR_VARIANT_QUOTE="Featured Quote (live)"
MOD_RATINGSTAR_VARIANT_CAROUSEL="Carousel (live)"
MOD_RATINGSTAR_VARIANT_WALL="Wall of Love (live)"
MOD_RATINGSTAR_VARIANT_FOOTER_BAR="Footer-Bar (live)"

MOD_RATINGSTAR_FIELD_POSITION_LABEL="Position"
MOD_RATINGSTAR_FIELD_POSITION_DESC="Bildschirm-Ecke für Floating-Badge / Footer-Bar. Auf „Aus RatingStar-Konfiguration“ belassen, um die im RatingStar-Admin eingestellte Position zu verwenden."

MOD_RATINGSTAR_POSITION_INHERIT="Aus RatingStar-Konfiguration"
MOD_RATINGSTAR_POSITION_BOTTOM_RIGHT="Unten rechts"
MOD_RATINGSTAR_POSITION_BOTTOM_LEFT="Unten links"
MOD_RATINGSTAR_POSITION_TOP_RIGHT="Oben rechts"
MOD_RATINGSTAR_POSITION_TOP_LEFT="Oben links"

MOD_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Basis-Origin"
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="Der RatingStar-Host, der seal.js und die Widget-Daten ausliefert. Nur für Staging oder eine selbst gehostete Instanz ändern — Standard ist https://ratingstar.de."

MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_LABEL="Client-seitiges Rich Snippet unterdrücken"
MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_DESC="Nur auf Ja setzen, wenn Sie das JSON-LD selbst server-seitig ausgeben (über das RatingStar-JSON-LD-Plugin). Setzt data-no-richsnippet=\"1\", damit seal.js keinen zweiten JSON-LD-Block injiziert. Es darf genau einen JSON-LD-Block pro Seite geben."

MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain-Whitelist"
MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Sobald im RatingStar-Admin (Tab „Auslieferung“) eine Liefer-Domain eingetragen ist, werden die Siegel-Daten nur an DNS-verifizierte Domains ausgeliefert. Tragen Sie die Domain dieser Website dort ein und verifizieren Sie sie per DNS — sonst lädt das Widget nicht."

MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Datenschutz / Consent"
MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="seal.js, seal.css, die Widget-Daten und das Tracking-Pixel werden von der RatingStar-Origin geladen (ein Dritt-Host). Nennen Sie diese Origin in Ihrer Datenschutzerklärung und behandeln Sie sie in Ihrem Consent-Tool. Der server-seitige Rich-Snippet-Weg braucht keine Client-Verbindung."
