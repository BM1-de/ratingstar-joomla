MOD_RATINGSTAR_FIELD_RENDER_MODE_LABEL="Ausgabe"
MOD_RATINGSTAR_FIELD_RENDER_MODE_DESC="„Live“ lädt das Siegel über seal.js von RatingStar. „Statisches Bild“ gibt nur ein Bild des Siegels mit Link zum Profil aus, ganz ohne JavaScript. Das Bild zeigt die aktuelle Bewertung; die Optionen im Reiter „Darstellung“ gelten dafür nicht. Statische Bilder gibt es für Rundsiegel, Banderole und Profil-Karte."
