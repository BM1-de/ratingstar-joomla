MOD_RATINGSTAR_FIELD_SLUG_LABEL="Profil-Slug (Filiale)"
MOD_RATINGSTAR_FIELD_SLUG_DESC="Der Slug Ihres RatingStar-Profils: der Teil nach /t/ in der Adresse des Profils, zum Beispiel cafe-sonne. Leer = site-weiter Wert aus dem Plugin „System - RatingStar“."
MOD_RATINGSTAR_FIELD_GROUP_LABEL="Gruppe"
MOD_RATINGSTAR_FIELD_GROUP_DESC="Slug der Gruppe: der Teil nach /g/ in der Adresse des Gruppenprofils. Ist eine Gruppe eingetragen, zeigt das Modul das Siegel der ganzen Gruppe über alle aktiven Filialen statt das einer einzelnen Filiale. Leer = site-weiter Wert aus dem Plugin „System - RatingStar“."

MOD_RATINGSTAR_FIELD_VARIANT_LABEL="Variante"
MOD_RATINGSTAR_FIELD_VARIANT_DESC="Welches Siegel oder Widget das Modul zeigt."
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_LABEL="Varianten und Tarife"
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_DESC="Rundsiegel und Banderole gibt es in jedem Tarif. Profil-Karte, Bewertungsleiste, Gesamtnote, Zitat, Karussell, Bewertungswand und Fußleiste sind Live-Widgets ab dem 4-Star-Tarif. In kleineren Tarifen zeigt RatingStar an ihrer Stelle automatisch die Banderole."

