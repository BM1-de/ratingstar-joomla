MOD_RATINGSTAR_FIELD_DATA_ATTRIBUTES_LABEL="Zusätzliche data-Attribute"
MOD_RATINGSTAR_FIELD_DATA_ATTRIBUTES_DESC="Für Fachleute: weitere Attribute aus dem Code, den RatingStar unter „Siegel & Widgets“ erzeugt, zum Beispiel data-car-count=\"4\" data-car-width=\"s\". Sie können auch den ganzen Code einfügen; übernommen werden nur data-Attribute. Diese Angaben haben Vorrang vor den Optionen darüber. Profil, Gruppe, Variante, Position und die Steuerung der Google-Sterne legen Sie nur über die Felder dieses Moduls fest."

; --- Erweitert ---
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Adresse des RatingStar-Servers"
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="Von dieser Adresse lädt das Modul Siegel und Daten. Leer = Wert aus dem Plugin „System - RatingStar“, sonst https://ratingstar.de. Nur für eine Test- oder eigene Installation ändern."

MOD_RATINGSTAR_FIELD_API_KEY_LABEL="API-Key für Google-Sterne auf diesen Seiten"
MOD_RATINGSTAR_FIELD_API_KEY_DESC="Optional. Leer = site-weiter API-Key aus dem Plugin „System - RatingStar“. Tragen Sie hier den API-Key einer Filiale ein, wenn dieses Modul auf einer Standortseite sitzt: Die Seiten, auf denen das Modul erscheint, erhalten dann die Google-Sterne dieser Filiale statt der site-weiten, zum Beispiel der Gruppe. Je Seite gibt das Plugin immer nur einen Block aus. Format: rs_live_ und 40 Zeichen. Voraussetzung: Das Plugin ist aktiviert."
MOD_RATINGSTAR_FIELD_API_KEY_INVALID="Der API-Key hat nicht die erwartete Form: rs_live_ gefolgt von 40 Buchstaben oder Ziffern."

MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_LABEL="Google-Sterne durch seal.js unterdrücken"
MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_DESC="Gibt das Plugin „System - RatingStar“ die Google-Sterne serverseitig aus, unterdrückt das Modul die Ausgabe durch seal.js von selbst: Je Seite gibt es genau einen Block. Stellen Sie nur dann auf „Ja“, wenn die strukturierten Daten aus einer anderen Quelle kommen."

MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain freigeben"
MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Tragen Sie die Domain dieser Website in RatingStar unter „Siegel & Widgets → Domains & Statistik“ im Abschnitt „Freigegebene Domains“ ein und bestätigen Sie sie mit dem DNS-Eintrag TXT _ratingstar.ihre-domain.de. Sobald dort erstmals eine Domain bestätigt ist, liefert RatingStar die Daten für Live-Siegel nur noch an bestätigte Domains; auf allen anderen bleibt das Siegel leer. Für ein Gruppen-Siegel gilt die eigene Liste im Backend der Gruppe, ebenfalls unter „Siegel & Widgets → Domains & Statistik“."

MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Datenschutz und Einwilligung"
MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="Das Live-Siegel lädt seal.js, seal.css, die Bewertungsdaten und ein Zählpixel vom RatingStar-Server (Standard: ratingstar.de). Der Browser Ihrer Besucher verbindet sich dabei mit diesem Server. Nennen Sie ihn in Ihrer Datenschutzerklärung und berücksichtigen Sie ihn in Ihrem Consent-Tool. Die serverseitigen Google-Sterne des Plugins brauchen keine Verbindung aus dem Browser; das statische Bild lädt nur eine Bilddatei."
