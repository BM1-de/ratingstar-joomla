; RatingStar module — English (en-GB)
; Each string on one line, value in double quotes.

MOD_RATINGSTAR="RatingStar"

MOD_RATINGSTAR_NO_SLUG="RatingStar: no profile slug is configured. Open the module settings and enter your RatingStar profile slug."

MOD_RATINGSTAR_FIELD_SLUG_LABEL="Profile slug"
MOD_RATINGSTAR_FIELD_SLUG_DESC="The slug of your RatingStar branch profile — the part after /t/ in its public URL (e.g. cafe-sonne for ratingstar.de/t/cafe-sonne)."

MOD_RATINGSTAR_FIELD_VARIANT_LABEL="Widget variant"
MOD_RATINGSTAR_FIELD_VARIANT_DESC="Which seal / widget to display. Static seals work on every plan; live widgets require a 4-Star plan or higher and fall back to a static banner otherwise."

MOD_RATINGSTAR_FIELD_VARIANT_NOTE_LABEL="About the variants"
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_DESC="Static seals (Round seal, Banderole) are available on every plan. Live widgets (from Profile card onwards) need a 4-Star plan; on lower plans RatingStar automatically degrades them to a static banner."

MOD_RATINGSTAR_VARIANT_SEAL_CIRCLE="Round seal (static)"
MOD_RATINGSTAR_VARIANT_SEAL_CIRCLE_BANNER="Banderole (static)"
MOD_RATINGSTAR_VARIANT_PROFILE_CARD="Profile card (live)"
MOD_RATINGSTAR_VARIANT_BAR="Rating bar (live)"
MOD_RATINGSTAR_VARIANT_HERO="Overall rating (live)"
MOD_RATINGSTAR_VARIANT_QUOTE="Quote (live)"
MOD_RATINGSTAR_VARIANT_CAROUSEL="Carousel (live)"
MOD_RATINGSTAR_VARIANT_WALL="Review wall (live)"
MOD_RATINGSTAR_VARIANT_FOOTER_BAR="Footer bar (live)"

MOD_RATINGSTAR_FIELD_POSITION_LABEL="Position"
MOD_RATINGSTAR_FIELD_POSITION_DESC="Where the profile card appears: right here in the content (inline) or floating in a screen corner. Leave on “From RatingStar settings” to use the position configured in your RatingStar admin."

MOD_RATINGSTAR_POSITION_INHERIT="From RatingStar settings"
MOD_RATINGSTAR_POSITION_INLINE="In the content (inline)"
MOD_RATINGSTAR_POSITION_BOTTOM_RIGHT="Bottom right"
MOD_RATINGSTAR_POSITION_BOTTOM_LEFT="Bottom left"
MOD_RATINGSTAR_POSITION_TOP_RIGHT="Top right"
MOD_RATINGSTAR_POSITION_TOP_LEFT="Top left"

MOD_RATINGSTAR_FIELD_THEME_LABEL="Colour scheme"
MOD_RATINGSTAR_FIELD_THEME_DESC="Light or dark — “Dark” adapts the rating bar, overall rating, quote, carousel and review wall to dark page backgrounds."
MOD_RATINGSTAR_THEME_LIGHT="Light"
MOD_RATINGSTAR_THEME_DARK="Dark"

MOD_RATINGSTAR_FIELD_RENDER_MODE_LABEL="Rendering"
MOD_RATINGSTAR_FIELD_RENDER_MODE_DESC="Live widget (seal.js, interactive) or a static image. The static image is a plain <img> of the seal SVG — no JavaScript, ideal for email, PDF, AMP or JS-off contexts. It always shows the current rating but is not interactive."

MOD_RATINGSTAR_RENDER_MODE_LIVE="Live widget (seal.js)"
MOD_RATINGSTAR_RENDER_MODE_STATIC="Static image (no JavaScript)"

MOD_RATINGSTAR_FIELD_STATIC_VARIANT_LABEL="Static variant"
MOD_RATINGSTAR_FIELD_STATIC_VARIANT_DESC="Which static image to show. Banner, circle and card are the seal SVG; award shows an achievement badge (requires the award slug below)."

MOD_RATINGSTAR_STATIC_VARIANT_BANNER="Banderole (SVG)"
MOD_RATINGSTAR_STATIC_VARIANT_CIRCLE="Round seal (SVG)"
MOD_RATINGSTAR_STATIC_VARIANT_CARD="Card (SVG)"
MOD_RATINGSTAR_STATIC_VARIANT_AWARD="Award badge"

MOD_RATINGSTAR_FIELD_AWARD_SLUG_LABEL="Award slug"
MOD_RATINGSTAR_FIELD_AWARD_SLUG_DESC="The achievement to show, as type-level (e.g. top_rated-3). Find the available awards in your RatingStar admin."

MOD_RATINGSTAR_SEAL_ALT="RatingStar rating seal"

MOD_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Base origin"
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="The RatingStar host that serves seal.js and the widget data. Only change this for staging or a self-hosted instance — the default is https://ratingstar.de."

MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_LABEL="Suppress client-side rich snippet"
MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_DESC="Set to Yes only if you output server-side JSON-LD yourself (via the RatingStar JSON-LD plugin). This adds data-no-richsnippet=\"1\" so seal.js does not inject a second JSON-LD block. There must be exactly one JSON-LD block per page."

MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain whitelist"
MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Once a domain is entered and DNS-verified in the RatingStar admin (Siegel & Widgets → Domains & Statistik), the seal data is only served to verified domains. Add and verify this site's domain there, otherwise the widget will not load."

MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Privacy / consent"
MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="seal.js, seal.css, the widget data and the tracking pixel are loaded from the RatingStar origin (a third-party host). Mention this origin in your privacy policy and handle it in your consent tool. The server-side rich-snippet route needs no client connection."
