MOD_RATINGSTAR_FIELD_DATA_ATTRIBUTES_LABEL="Additional data attributes"
MOD_RATINGSTAR_FIELD_DATA_ATTRIBUTES_DESC="For experts: further attributes from the code RatingStar generates under “Siegel & Widgets”, for example data-car-count=\"4\" data-car-width=\"s\". You may paste the whole code; only data attributes are used. These values take precedence over the options above. Profile, group, variant, position and the control of the Google review stars are set through the fields of this module only."

; --- Advanced ---
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Address of the RatingStar server"
MOD_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="The module loads seals and data from this address. Empty = value from the “System - RatingStar” plugin, otherwise https://ratingstar.de. Only change this for a test or self-hosted installation."

MOD_RATINGSTAR_FIELD_API_KEY_LABEL="API key for Google review stars on these pages"
MOD_RATINGSTAR_FIELD_API_KEY_DESC="Optional. Empty = site-wide API key from the “System - RatingStar” plugin. Enter the API key of a branch here when this module sits on a location page: the pages the module appears on then get the Google review stars of that branch instead of the site-wide ones, for example those of the group. The plugin always prints one block per page only. Format: rs_live_ and 40 characters. Requires the plugin to be enabled."
MOD_RATINGSTAR_FIELD_API_KEY_INVALID="The API key does not have the expected form: rs_live_ followed by 40 letters or digits."

MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_LABEL="Suppress Google review stars from seal.js"
MOD_RATINGSTAR_FIELD_NO_RICHSNIPPET_DESC="When the “System - RatingStar” plugin prints the Google review stars server-side, the module suppresses the output of seal.js by itself: there is exactly one block per page. Only switch to “Yes” if the structured data comes from another source."

MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Approve the domain"
MOD_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Add the domain of this website in RatingStar under “Siegel & Widgets → Domains & Statistik”, section “Freigegebene Domains”, and confirm it with the DNS record TXT _ratingstar.your-domain.com. As soon as a domain has been confirmed there for the first time, RatingStar serves the data for live seals to confirmed domains only; on all others the seal stays empty. A group seal uses its own list in the back end of the group, also under “Siegel & Widgets → Domains & Statistik”."

MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Privacy and consent"
MOD_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="The live seal loads seal.js, seal.css, the review data and a counting pixel from the RatingStar server (default: ratingstar.de). Your visitors' browsers connect to that server. Name it in your privacy policy and cover it in your consent tool. The plugin's server-side Google review stars need no connection from the browser; the static image only loads one image file."
