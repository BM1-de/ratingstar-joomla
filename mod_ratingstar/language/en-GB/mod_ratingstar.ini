MOD_RATINGSTAR_AWARD_ALT="Award – view the profile on RatingStar"

MOD_RATINGSTAR_OPTION_DEFAULT="Default (portal)"

; --- Module ---
MOD_RATINGSTAR_FIELD_SLUG_LABEL="Profile slug (branch)"
MOD_RATINGSTAR_FIELD_SLUG_DESC="The slug of your RatingStar profile: the part after /t/ in the profile address, for example cafe-sonne. Empty = site-wide value from the “System - RatingStar” plugin."
MOD_RATINGSTAR_FIELD_GROUP_LABEL="Group"
MOD_RATINGSTAR_FIELD_GROUP_DESC="Slug of the group: the part after /g/ in the address of the group profile. With a group set, the module shows the seal of the whole group across all active branches instead of a single branch. Empty = site-wide value from the “System - RatingStar” plugin."

MOD_RATINGSTAR_FIELD_VARIANT_LABEL="Variant"
MOD_RATINGSTAR_FIELD_VARIANT_DESC="Which seal or widget the module shows."
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_LABEL="Variants and plans"
MOD_RATINGSTAR_FIELD_VARIANT_NOTE_DESC="Round seal and banner seal are available on every plan. Profile card, rating bar, overall rating, quote, carousel, review wall and footer bar are live widgets from the 4-Star plan up. On smaller plans RatingStar automatically shows the banner seal in their place."

