MOD_RATINGSTAR_FIELD_RENDER_MODE_LABEL="Output"
MOD_RATINGSTAR_FIELD_RENDER_MODE_DESC="“Live” loads the seal through RatingStar's seal.js. “Static image” only prints an image of the seal with a link to the profile, without any JavaScript. The image shows the current rating; the options on the “Display” tab do not apply to it. Static images exist for the round seal, the banner seal and the profile card."
MOD_RATINGSTAR_RENDER_MODE_LIVE="Live (seal.js)"
MOD_RATINGSTAR_RENDER_MODE_STATIC="Static image (no JavaScript)"

