; RatingStar module — English (en-GB)
; Each string on one line, value in double quotes.

MOD_RATINGSTAR="RatingStar"

MOD_RATINGSTAR_NO_SLUG="RatingStar: neither a profile slug nor a group is set for this module. Enter one of them in the module or site-wide in the “System - RatingStar” plugin."
