; RatingStar System-Plugin — Deutsch (de-DE)

PLG_SYSTEM_RATINGSTAR="System - RatingStar"

PLG_SYSTEM_RATINGSTAR_SLUG_OK="RatingStar: Profil „%s“ gefunden und bestätigt."
PLG_SYSTEM_RATINGSTAR_SLUG_REACHED="RatingStar: Profil „%s“ ist erreichbar."
PLG_SYSTEM_RATINGSTAR_SLUG_UNVERIFIED="RatingStar: Profil „%s“ konnte nicht abgerufen werden. Der Wert wurde gespeichert — bitte Slug und Basis-Origin prüfen."

PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_LABEL="API-Key"
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_DESC="Ihr RatingStar-API-Key (Format rs_live_ gefolgt von 40 Zeichen). Treibt den rename-festen key-basierten JSON-LD-Endpunkt. Im RatingStar-Admin zu finden und zu rotieren."

PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Basis-Origin"
PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="Der RatingStar-Host, der das JSON-LD ausliefert. Nur für Staging oder eine selbst gehostete Instanz ändern — Standard ist https://ratingstar.de."

PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_LABEL="Cache-Dauer (Minuten)"
PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_DESC="Wie lange das geholte JSON-LD server-seitig gecacht wird. Danach werden Key-Rotation und neue Bewertungen übernommen. Ein manuelles Cache-Leeren (System → Cache leeren) aktualisiert es ebenfalls."

PLG_SYSTEM_RATINGSTAR_FIELD_KEY_NOTE_LABEL="Funktionsweise"
PLG_SYSTEM_RATINGSTAR_FIELD_KEY_NOTE_DESC="Dieses Plugin holt das fertige LocalBusiness-JSON-LD vom key-basierten Endpunkt und injiziert genau einen schema.org-Block in den Seitenkopf — ohne Client-Verbindung für das Rich Snippet. Wird zusätzlich ein Siegel-Widget angezeigt, unterdrückt das automatisch dessen client-seitiges JSON-LD, sodass es nur einen Block pro Seite gibt. Das aggregateRating erscheint erst ab dem 4-Star-Tarif mit mindestens einer Bewertung."

PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain-Whitelist"
PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Der key-basierte Endpunkt ist in jedem Tarif offen und nicht domain-beschränkt — das JSON-LD wird unabhängig von der Liefer-Whitelist ausgeliefert. (Die slug-basierten Widget-Daten sind dagegen auf DNS-verifizierte Domains beschränkt, sobald im RatingStar-Admin eine Liefer-Domain eingetragen ist.)"

PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Datenschutz / Consent"
PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="Das JSON-LD wird Server-zu-Server geholt und inline gerendert — es erzeugt also keine Dritt-Verbindung im Browser der Besucher und braucht kein Consent. (Das seal.js des Siegel-Widgets verbindet sich dagegen mit der RatingStar-Origin — diese Origin in Datenschutzerklärung und Consent-Tool nennen.)"
