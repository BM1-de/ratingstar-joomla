; RatingStar System-Plugin — Deutsch (de-DE)
; Jeder String in einer Zeile, Wert in doppelten Anführungszeichen.

PLG_SYSTEM_RATINGSTAR="System - RatingStar"

; --- Meldungen nach dem Speichern ---
PLG_SYSTEM_RATINGSTAR_SLUG_OK="RatingStar: Profil „%s“ gefunden."
PLG_SYSTEM_RATINGSTAR_SLUG_REACHED="RatingStar: Das Profil „%s“ ist erreichbar."
PLG_SYSTEM_RATINGSTAR_SLUG_UNVERIFIED="RatingStar: Das Profil „%s“ ließ sich nicht abrufen. Der Wert wurde trotzdem gespeichert. Bitte prüfen Sie den Profil-Slug und die Adresse des RatingStar-Servers."
PLG_SYSTEM_RATINGSTAR_GROUP_OK="RatingStar: Gruppe „%s“ gefunden."
PLG_SYSTEM_RATINGSTAR_GROUP_REACHED="RatingStar: Die Gruppe „%s“ ist erreichbar."
PLG_SYSTEM_RATINGSTAR_GROUP_UNVERIFIED="RatingStar: Die Gruppe „%s“ ließ sich nicht abrufen. Der Wert wurde trotzdem gespeichert. Bitte prüfen Sie den Slug der Gruppe und die Adresse des RatingStar-Servers."
PLG_SYSTEM_RATINGSTAR_KEY_OK="RatingStar: API-Key bestätigt, er gehört zu „%s“."
PLG_SYSTEM_RATINGSTAR_KEY_UNVERIFIED="RatingStar: Mit diesem API-Key ließen sich keine Daten abrufen. Der Wert wurde trotzdem gespeichert. Bitte prüfen Sie den Schlüssel und die Adresse des RatingStar-Servers. Wurde der Schlüssel in RatingStar neu erzeugt, gilt nur noch der neue."

; --- Einstellungen ---
PLG_SYSTEM_RATINGSTAR_FIELD_SLUG_LABEL="Profil-Slug (Filiale)"
PLG_SYSTEM_RATINGSTAR_FIELD_SLUG_DESC="Site-weiter Standard für alle RatingStar-Module ohne eigene Angabe: der Teil nach /t/ in der Adresse Ihres RatingStar-Profils, zum Beispiel cafe-sonne."
PLG_SYSTEM_RATINGSTAR_FIELD_GROUP_LABEL="Gruppe"
PLG_SYSTEM_RATINGSTAR_FIELD_GROUP_DESC="Site-weiter Standard für alle RatingStar-Module ohne eigene Angabe: der Slug der Gruppe, also der Teil nach /g/ in der Adresse des Gruppenprofils. Ist eine Gruppe eingetragen, zeigen diese Module das Siegel der ganzen Gruppe statt das einer Filiale. Tragen Sie dann unten auch den API-Key der Gruppe ein."

PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_LABEL="API-Key"
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_DESC="API-Key der Filiale oder der Gruppe, Format: rs_live_ und 40 Zeichen. Sie finden ihn in RatingStar auf der Seite „Google-Sterne“. Mit dem Schlüssel holt das Plugin die Daten für die Sterne in Google ab; er bleibt gültig, auch wenn sich der Profil-Slug ändert. Wird der Schlüssel in RatingStar neu erzeugt, verliert der alte sofort seine Gültigkeit: Tragen Sie dann hier den neuen ein."
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_INVALID="Der API-Key hat nicht die erwartete Form: rs_live_ gefolgt von 40 Buchstaben oder Ziffern."

PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_LABEL="Sterne für Google ausgeben"
PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_DESC="Gibt die strukturierten Daten Ihrer Bewertungen im Seitenkopf aus. Dafür ist ein gültiger API-Key nötig."

PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_NOTE_LABEL="So funktioniert es"
PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_NOTE_DESC="Das Plugin holt die strukturierten Daten (schema.org) mit dem API-Key serverseitig bei RatingStar ab, speichert sie zwischen und gibt sie als einen Block im Seitenkopf aus. Je Seite gibt es genau einen Block; die Siegel-Module unterdrücken dann die Ausgabe durch seal.js von selbst. Eine Gesamtbewertung enthält der Block ab dem 4-Star-Tarif und sobald es Bewertungen gibt; es zählen dieselben Bewertungen wie in Ihrem Siegel. Ob Google Sterne anzeigt, entscheidet Google. Für Standortseiten geben Sie einem Siegel-Modul den API-Key der Filiale mit: Die Seiten dieses Moduls erhalten dann die Daten der Filiale statt der site-weiten."

PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain freigeben"
PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="Für die Live-Siegel der Module: Tragen Sie die Domain dieser Website in RatingStar unter „Siegel & Widgets → Domains & Statistik“ im Abschnitt „Freigegebene Domains“ ein und bestätigen Sie sie mit dem DNS-Eintrag TXT _ratingstar.ihre-domain.de. Sobald dort erstmals eine Domain bestätigt ist, liefert RatingStar die Siegel-Daten nur noch an bestätigte Domains. Für ein Gruppen-Siegel gilt die eigene Liste im Backend der Gruppe, ebenfalls unter „Siegel & Widgets → Domains & Statistik“. Der Abruf mit dem API-Key ist davon nicht betroffen und in jedem Tarif möglich."

PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Datenschutz und Einwilligung"
PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="Die Daten für die Sterne in Google holt Ihr Server bei RatingStar ab; der Browser Ihrer Besucher baut dafür keine Verbindung zu RatingStar auf. Anders die Live-Siegel der Module: Sie laden seal.js, seal.css, die Bewertungsdaten und ein Zählpixel vom RatingStar-Server (Standard: ratingstar.de). Nennen Sie diesen Server in Ihrer Datenschutzerklärung und berücksichtigen Sie ihn in Ihrem Consent-Tool."

PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Adresse des RatingStar-Servers"
PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="Aus dieser einen Adresse entstehen alle Adressen für Siegel, Daten und Profil-Links, auch in den Modulen ohne eigene Angabe. Standard: https://ratingstar.de. Nur für eine Test- oder eigene Installation ändern."

PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_LABEL="Zwischenspeicher (Minuten)"
PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_DESC="So lange speichert das Plugin die abgeholten Daten zwischen. Standard: 360 Minuten (6 Stunden). Einen fehlgeschlagenen Abruf versucht es nach 15 Minuten erneut. Sofort neu abholen: dieses Plugin speichern oder unter „System → Cache leeren“ den Eintrag plg_system_ratingstar leeren."
