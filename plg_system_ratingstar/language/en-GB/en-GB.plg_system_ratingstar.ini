; RatingStar system plugin — English (en-GB)

PLG_SYSTEM_RATINGSTAR="System - RatingStar"

PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_LABEL="API key"
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_DESC="Your RatingStar API key (format rs_live_ followed by 40 characters). Drives the rename-proof key-based JSON-LD endpoint. Find and rotate it in the RatingStar admin."

PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Base origin"
PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="The RatingStar host that serves the JSON-LD. Only change this for staging or a self-hosted instance — the default is https://ratingstar.de."

PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_LABEL="Cache lifetime (minutes)"
PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_DESC="How long the fetched JSON-LD is cached server-side. After this, key rotation and new reviews are picked up. A manual cache clear (System → Clear Cache) also refreshes it."

PLG_SYSTEM_RATINGSTAR_FIELD_KEY_NOTE_LABEL="How it works"
PLG_SYSTEM_RATINGSTAR_FIELD_KEY_NOTE_DESC="This plugin fetches the ready-made LocalBusiness JSON-LD from the key-based endpoint and injects exactly one schema.org block into the page head — no client connection needed for the rich snippet. If you also display a seal widget, it automatically suppresses the widget's client-side JSON-LD so there is only one block per page. The aggregateRating only appears on a 4-Star plan or higher with at least one review."

PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Domain whitelist"
PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="The key-based endpoint is open on every plan and not domain-restricted, so the JSON-LD is served regardless of the delivery whitelist. (The slug-based widget data, by contrast, is restricted to DNS-verified domains once a delivery domain is set in the RatingStar admin.)"

PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Privacy / consent"
PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="The JSON-LD is fetched server-to-server and rendered inline, so it adds no third-party connection in the visitor's browser and needs no consent. (The seal widget's seal.js, by contrast, does connect to the RatingStar origin — mention that origin in your privacy policy and consent tool.)"
