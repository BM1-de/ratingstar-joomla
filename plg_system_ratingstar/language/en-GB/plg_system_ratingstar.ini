; RatingStar system plugin — English (en-GB)
; Each string on one line, value in double quotes.

PLG_SYSTEM_RATINGSTAR="System - RatingStar"

; --- Messages after saving ---
PLG_SYSTEM_RATINGSTAR_SLUG_OK="RatingStar: profile “%s” found."
PLG_SYSTEM_RATINGSTAR_SLUG_REACHED="RatingStar: the profile “%s” is reachable."
PLG_SYSTEM_RATINGSTAR_SLUG_UNVERIFIED="RatingStar: the profile “%s” could not be retrieved. The value was saved anyway. Please check the profile slug and the address of the RatingStar server."
PLG_SYSTEM_RATINGSTAR_GROUP_OK="RatingStar: group “%s” found."
PLG_SYSTEM_RATINGSTAR_GROUP_REACHED="RatingStar: the group “%s” is reachable."
PLG_SYSTEM_RATINGSTAR_GROUP_UNVERIFIED="RatingStar: the group “%s” could not be retrieved. The value was saved anyway. Please check the slug of the group and the address of the RatingStar server."
PLG_SYSTEM_RATINGSTAR_KEY_OK="RatingStar: API key confirmed, it belongs to “%s”."
PLG_SYSTEM_RATINGSTAR_KEY_UNVERIFIED="RatingStar: no data could be retrieved with this API key. The value was saved anyway. Please check the key and the address of the RatingStar server. If the key was regenerated in RatingStar, only the new one is valid."

; --- Settings ---
PLG_SYSTEM_RATINGSTAR_FIELD_SLUG_LABEL="Profile slug (branch)"
PLG_SYSTEM_RATINGSTAR_FIELD_SLUG_DESC="Site-wide default for all RatingStar modules without a value of their own: the part after /t/ in the address of your RatingStar profile, for example cafe-sonne."
PLG_SYSTEM_RATINGSTAR_FIELD_GROUP_LABEL="Group"
PLG_SYSTEM_RATINGSTAR_FIELD_GROUP_DESC="Site-wide default for all RatingStar modules without a value of their own: the slug of the group, i.e. the part after /g/ in the address of the group profile. With a group set, these modules show the seal of the whole group instead of a branch. In that case also enter the API key of the group below."

PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_LABEL="API key"
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_DESC="API key of the branch or the group, format: rs_live_ and 40 characters. You find it in RatingStar on the “Google-Sterne” page. The plugin uses the key to fetch the data for the stars in Google; it stays valid even if the profile slug changes. If the key is regenerated in RatingStar, the old one stops working at once: enter the new one here."
PLG_SYSTEM_RATINGSTAR_FIELD_API_KEY_INVALID="The API key does not have the expected form: rs_live_ followed by 40 letters or digits."

PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_LABEL="Print the stars for Google"
PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_DESC="Prints the structured data of your reviews in the page head. Requires a valid API key."

PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_NOTE_LABEL="How it works"
PLG_SYSTEM_RATINGSTAR_FIELD_JSONLD_NOTE_DESC="The plugin uses the API key to fetch the structured data (schema.org, type LocalBusiness) from RatingStar server-side, caches it and prints it as one block in the page head. There is exactly one block per page; the seal modules then suppress the output of seal.js by themselves. The block contains an overall rating from the 4-Star plan up and once there are reviews of your own, submitted on RatingStar; reviews taken over from other portals do not count for it. Whether Google shows stars is up to Google. For location pages, give a seal module the API key of the branch: the pages of that module then get the data of the branch instead of the site-wide data."

PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_LABEL="Approve the domain"
PLG_SYSTEM_RATINGSTAR_FIELD_WHITELIST_NOTE_DESC="For the live seals of the modules: add the domain of this website in RatingStar under “Siegel & Widgets → Domains & Statistik”, section “Freigegebene Domains”, and confirm it with the DNS record TXT _ratingstar.your-domain.com. As soon as a domain has been confirmed there for the first time, RatingStar serves the seal data to confirmed domains only. A group seal uses its own list in the back end of the group, also under “Siegel & Widgets → Domains & Statistik”. Fetching with the API key is not affected and works on every plan."

PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_LABEL="Privacy and consent"
PLG_SYSTEM_RATINGSTAR_FIELD_PRIVACY_NOTE_DESC="Your server fetches the data for the stars in Google from RatingStar; your visitors' browsers do not connect to RatingStar for it. The live seals of the modules are different: they load seal.js, seal.css, the review data and a counting pixel from the RatingStar server (default: ratingstar.de). Name that server in your privacy policy and cover it in your consent tool."

PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_LABEL="Address of the RatingStar server"
PLG_SYSTEM_RATINGSTAR_FIELD_BASE_ORIGIN_DESC="All addresses for seals, data and profile links are built from this one address, also in the modules without a value of their own. Default: https://ratingstar.de. Only change this for a test or self-hosted installation."

PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_LABEL="Cache (minutes)"
PLG_SYSTEM_RATINGSTAR_FIELD_CACHE_DESC="How long the plugin keeps the fetched data. Default: 360 minutes (6 hours). A failed fetch is retried after 15 minutes. To fetch again at once, save this plugin or clear the entry plg_system_ratingstar under “System → Clear Cache”."
